<section class="panel admin-home">
  <header>
    <p class="signed-in">
      @if (user.hasValue()) {
        Signed in as <strong>{{ user.value().email }}</strong>
      } @else if (user.isLoading()) {
        Checking your session…
      } @else {
        Signed in
      }
    </p>
    <button class="button sign-out" type="button" (click)="signOut()">Sign out</button>
  </header>

  <h2>Content</h2>
  <ul class="sections">
    @for (section of sections; track section) {
      <li>
        <span>{{ section }}</span>
        <span class="badge">Coming soon</span>
      </li>
    }
  </ul>
</section>
