<section class="panel login">
  <h2>Sign in to edit the resume</h2>

  <form [formRoot]="form" novalidate>
    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        [formField]="form.email"
        autocomplete="username"
        [attr.aria-invalid]="showError(form.email()) ? 'true' : null"
        [attr.aria-describedby]="showError(form.email()) ? 'login-email-error' : null"
      />
      @if (showError(form.email())) {
        <p class="field-error" id="login-email-error">{{ form.email().errors()[0].message }}</p>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        [formField]="form.password"
        autocomplete="current-password"
        [attr.aria-invalid]="showError(form.password()) ? 'true' : null"
        [attr.aria-describedby]="showError(form.password()) ? 'login-password-error' : null"
      />
      @if (showError(form.password())) {
        <p class="field-error" id="login-password-error">
          {{ form.password().errors()[0].message }}
        </p>
      }
    </div>

    <button class="button primary" type="submit" [disabled]="form().submitting()">
      {{ form().submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
