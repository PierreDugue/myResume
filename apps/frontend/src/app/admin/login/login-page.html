<section class="panel login">
  <h2>Sign in to edit the resume</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="showError('email') ? 'true' : null"
        [attr.aria-describedby]="showError('email') ? 'login-email-error' : null"
      />
      @if (showError('email')) {
        <p class="field-error" id="login-email-error">{{ errorFor('email') }}</p>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showError('password') ? 'true' : null"
        [attr.aria-describedby]="showError('password') ? 'login-password-error' : null"
      />
      @if (showError('password')) {
        <p class="field-error" id="login-password-error">{{ errorFor('password') }}</p>
      }
    </div>

    <button class="button primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
