@if (resume.hasValue()) {
  <app-plain-resume [resume]="resume.value()">
    @if (signedIn()) {
      <a class="button edit-resume" routerLink="/admin/resume">Edit</a>
    }
    <button class="button print" type="button" (click)="print()">Print / Save as PDF</button>
  </app-plain-resume>
} @else if (resume.error()) {
  <section class="panel empty-state">
    <p role="alert">The resume could not be loaded.</p>
    <button class="button retry" type="button" (click)="resume.reload()">Try again</button>
  </section>
} @else {
  <p class="loading">Loading the resume…</p>
}
