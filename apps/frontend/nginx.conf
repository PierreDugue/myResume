server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Security headers. The admin token lives in localStorage, so the CSP is the main defense
    # against XSS: scripts only from this site (no inline scripts, see public/theme-init.js).
    # Inline styles stay allowed: Angular component styles and ECharts use them.
    # img-src allows https: for profile and project images hosted elsewhere.
    # 'always' keeps the headers on error responses too. nginx drops server-level add_header in a
    # location that sets its own, so locations below must not use add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API and WebSockets (Socket.IO at /api/socket.io) -> NestJS.
    # No trailing slash on proxy_pass: the /api prefix is kept, the backend uses it as global prefix.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1h;
    }
}
