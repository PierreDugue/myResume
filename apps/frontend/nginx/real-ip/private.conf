# Proxies nginx trusts to report the visitor's IP (REAL_IP_PROXIES=private, the default):
# private networks only, i.e. Docker Compose, Caddy (docker-compose.prod.yml) and Render's internal
# proxy. See nginx.conf.template.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
