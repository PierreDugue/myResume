# CI: checks every push and pull request; on main, also publishes the Docker images to GHCR.
#
#   ghcr.io/pierredugue/my-resume-backend   (apps/backend/Dockerfile)
#   ghcr.io/pierredugue/my-resume-frontend  (apps/frontend/Dockerfile)
#
# Tags: `latest` and `sha-<short commit>` (to roll back, see docker-compose.prod.yml).
# Then asks Render to deploy them, when the deploy hook secrets are set (docs/deployment.md).
# Each image is multi-platform: linux/amd64 and linux/arm64, each built on a native runner
# (no emulation), then combined into one image name.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  IMAGE_PREFIX: ghcr.io/pierredugue/my-resume

jobs:
  checks:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the backend integration tests (each test file creates its own).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NX_NO_CLOUD: true
      CYPRESS_INSTALL_BINARY: 0
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test typecheck build
      - run: npx nx run backend:integration
      - name: Test nginx's visitor-IP config
        run: apps/frontend/nginx/test-real-ip.sh

  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # free native Arm runner for public repos
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed without a tag (by digest); the merge job below tags the combined image.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }},mode=max
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.app }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Show the published image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  deploy-render:
    name: Deploy to Render
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Render doesn't redeploy when an image is pushed: call each service's deploy hook
      # (Render > service > Settings > Deploy Hook), stored as repository secrets.
      # `imgURL` deploys exactly this commit's image instead of whatever `latest` is by then.
      # Skipped (with a notice) while the secrets aren't set.
      - name: Call the deploy hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          deploy() {
            local app=$1 hook=$2
            if [ -z "$hook" ]; then
              echo "::notice::No Render deploy hook for the $app; skipped."
              return
            fi
            curl -fsS -o /dev/null -G "$hook" \
              --data-urlencode "imgURL=${IMAGE_PREFIX}-${app}:${tag}"
            echo "Asked Render to deploy the $app at $tag."
          }
          deploy backend "$BACKEND_HOOK"
          deploy frontend "$FRONTEND_HOOK"
