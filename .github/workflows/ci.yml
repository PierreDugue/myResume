# CI: checks every push and pull request; on main, then publishes the Docker images and deploys them.
#
#   lint ─────────────┐
#   unit tests ───────┤
#   integration tests ┤
#   nginx test ───────┼─> publish (publish.yml) ─> deploy (deploy.yml)
#   build backend ────┤      main only               main only
#   build frontend ───┘
#
# The checks run in parallel; publishing waits for all of them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx run-many -t lint typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx run-many -t test

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      # Throwaway database (each test file creates its own).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx run backend:integration

  nginx:
    name: nginx visitor-IP test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: apps/frontend/nginx/test-real-ip.sh

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx build backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx build frontend

  publish:
    name: Publish
    needs: [lint, test, integration, nginx, build-backend, build-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml

  deploy:
    name: Deploy
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
