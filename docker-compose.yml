services:
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: reachable from this machine (local dev), never from the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: app_backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      PORT: 3000 # internal port, nginx proxies to backend:3000; BACKEND_PORT only changes the host port
      NODE_ENV: ${NODE_ENV:-production}
      # Auth (see CLAUDE.md, Configuration): JWT_SECRET and PASSWORD_PEPPER are required (32+ characters, different).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in .env (openssl rand -base64 48)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: only needed where nginx reaches the backend through a public address (Render).
      PROXY_SECRET: ${PROXY_SECRET:-}
    ports:
      # Loopback only: visitors go through nginx. A public backend port would let clients forge
      # X-Forwarded-For and dodge the per-IP rate limits (see CLAUDE.md, Auth).
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000 # where nginx sends /api (the image's default)
      PROXY_SECRET: ${PROXY_SECRET:-} # same value as the backend's, if set
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
